# Canonical environment-policy configuration.
# Conda remains the repository default while Phase 4 introduces native uv
# as an alternate Python authority. The explicit Python request is consumed
# by native-uv mode; Conda mode continues to use the active Conda interpreter.

[environment]
authority = "conda"
venv = ".venv"
provenance_file = ".project-source-python.json"

[python]
request = "3.12"

[uv]
invocation = "python-module"
