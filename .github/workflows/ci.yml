name: CI

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.label }} / Make
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - authority: conda
            label: Conda
          - authority: uv
            label: uv
    env:
      SCAFFOLDING_EXPECT_AUTHORITY: ${{ matrix.authority }}
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate Conda authority
        if: matrix.authority == 'conda'
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: python-scaffolding-ci
          python-version: "3.12"
          auto-update-conda: false

      - name: Install native uv authority
        if: matrix.authority == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Select Conda policy for this lane
        if: matrix.authority == 'conda'
        run: >-
          python -c "from pathlib import Path; p=Path('environment.toml');
          s=p.read_text(encoding='utf-8');
          old='authority = '+chr(34)+'uv'+chr(34);
          new='authority = '+chr(34)+'conda'+chr(34);
          assert old in s;
          p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Environment baseline
        run: |
          python --version
          make --version
          python -c "from pathlib import Path; print(next(line for line in Path('environment.toml').read_text(encoding='utf-8').splitlines() if line.startswith('authority = ')))"

      - name: Conda baseline
        if: matrix.authority == 'conda'
        run: conda info --envs

      - name: uv baseline
        if: matrix.authority == 'uv'
        run: uv --version

      - name: Bootstrap scaffold
        run: make setup

      - name: Quality gates
        run: make check

  windows:
    name: Windows / ${{ matrix.label }} / Make
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - authority: conda
            label: Conda
          - authority: uv
            label: uv
    env:
      SCAFFOLDING_EXPECT_AUTHORITY: ${{ matrix.authority }}
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Activate Conda authority
        if: matrix.authority == 'conda'
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          activate-environment: python-scaffolding-ci
          python-version: "3.12"
          auto-update-conda: false

      - name: Install native uv authority
        if: matrix.authority == 'uv'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install GNU Make
        run: choco install make --yes --no-progress

      - name: Select Conda policy for this lane
        if: matrix.authority == 'conda'
        run: >-
          python -c "from pathlib import Path; p=Path('environment.toml');
          s=p.read_text(encoding='utf-8');
          old='authority = '+chr(34)+'uv'+chr(34);
          new='authority = '+chr(34)+'conda'+chr(34);
          assert old in s;
          p.write_text(s.replace(old,new,1),encoding='utf-8')"

      - name: Environment baseline
        run: |
          python --version
          make --version
          python -c "from pathlib import Path; print(next(line for line in Path('environment.toml').read_text(encoding='utf-8').splitlines() if line.startswith('authority = ')))"

      - name: Conda baseline
        if: matrix.authority == 'conda'
        run: conda info --envs

      - name: uv baseline
        if: matrix.authority == 'uv'
        run: uv --version

      - name: Bootstrap scaffold
        run: make setup

      - name: Rebuild from active project venv
        run: |
          $env:VIRTUAL_ENV = "$PWD\.venv"
          $env:PATH = "$env:VIRTUAL_ENV\Scripts;$env:PATH"
          make env-rebuild

      - name: Quality gates
        run: make check
